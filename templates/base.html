{% load static %}
<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="KASIYASAT — Campus Equipment Borrowing and Inventory System. Request, release, track, and maintain campus equipment.">
    <meta name="theme-color" content="#0B2545">
    <title>{% block title %}KASIYASAT{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin-pagination.css' %}">
    <link rel="stylesheet" href="{% static 'css/print.css' %}" media="print">
    <script>
        document.documentElement.classList.remove('no-js');
        document.documentElement.classList.add('js');
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="app-body {% block body_class %}{% endblock %}">
    {% include "partials/_icons.html" %}
    <nav class="skip-nav" aria-label="Skip navigation">
        <a class="skip-link" href="#main-content">Skip to main content</a>
    </nav>
    {% block main_layout %}{% endblock %}
    <script src="{% static 'js/app.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
