
{% if page_obj %}
<div class="admin-pagination admin-pagination--server"
     aria-label="{{ label|default:'Table pagination' }}">

  <label class="admin-pagination__rows">
    Rows per page

    <select
      class="admin-pagination__size"
      aria-label="Rows per page"
      onchange="
        const params = new URLSearchParams(window.location.search);
        params.set('per_page', this.value);
        params.delete('page');
        window.location.search = params.toString();
      ">

      <option value="10"
        {% if request.GET.per_page == '10' or not request.GET.per_page %}selected{% endif %}>
        10
      </option>

      <option value="20"
        {% if request.GET.per_page == '20' %}selected{% endif %}>
        20
      </option>

      <option value="50"
        {% if request.GET.per_page == '50' %}selected{% endif %}>
        50
      </option>

      <option value="100"
        {% if request.GET.per_page == '100' %}selected{% endif %}>
        100
      </option>

    </select>
  </label>

  <div class="admin-pagination__nav">

    {% if page_obj.has_previous %}
      <a class="admin-pagination__button"
         href="{% querystring page=page_obj.previous_page_number %}">
        ‹ Previous
      </a>
    {% else %}
      <button class="admin-pagination__button" disabled>
        ‹ Previous
      </button>
    {% endif %}

    <span class="admin-pagination__info">
      Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages|default:1 }}
    </span>

    {% if page_obj.has_next %}
      <a class="admin-pagination__button"
         href="{% querystring page=page_obj.next_page_number %}">
        Next ›
      </a>
    {% else %}
      <button class="admin-pagination__button" disabled>
        Next ›
      </button>
    {% endif %}

  </div>
</div>
{% endif %}
